name: Sync site from FTP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-from-ftp.yml

permissions:
  contents: write

concurrency:
  group: sync-from-ftp
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror the live site from FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "::notice::FTP secrets are present."
          sudo apt-get update
          sudo apt-get install -y lftp
          echo '' | base64 -d > /tmp/prep.py
          python3 /tmp/prep.py
          echo "::notice::Starting FTP download."
          if ! lftp -f /tmp/mirror-ftps.lftp > /tmp/lftp-ftps.log 2>&1; then
            echo "::warning::FTPS connection failed. Retrying plain FTP."
            if ! lftp -f /tmp/mirror-ftp.lftp > /tmp/lftp-ftp.log 2>&1; then
              if grep -Eqi 'login failed|login incorrect|530 ' /tmp/lftp-ftp.log /tmp/lftp-ftps.log; then
                echo "::error::FTP login was rejected. Check FTP_USERNAME and FTP_PASSWORD."
              elif grep -Eqi 'name or service|temporary failure|no route|connection refused|not connected' /tmp/lftp-ftp.log /tmp/lftp-ftps.log; then
                echo "::error::Could not reach the FTP server. Check FTP_SERVER and FTP_PORT."
              else
                echo "::error::FTP download failed."
              fi
              exit 1
            fi
          fi
          if [ -f public_html/index.php ] && [ ! -f index.php ]; then
            shopt -s dotglob
            mv public_html/* .
            rmdir public_html || true
          elif [ -f www/index.php ] && [ ! -f index.php ]; then
            shopt -s dotglob
            mv www/* .
            rmdir www || true
          fi
          rm -rf data
          find . -type f \( -name 'dbconfig.php' -o -name '*.sql' -o -name '.env' -o -name '.env.*' \) ! -path './.git/*' -delete
          find . -type f -size +90M ! -path './.git/*' -delete
          if [ ! -f index.php ]; then
            dirs="$(find . -maxdepth 1 -mindepth 1 -type d ! -name '.git' -printf '%f ')"
            echo "::error::Downloaded files, but index.php was not in the FTP login directory. Top folders: ${dirs}"
            exit 1
          fi
          count="$(find . -type f ! -path './.git/*' | wc -l)"
          echo "::notice::Site root found. File count: ${count}"

      - name: Commit the synced site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::No file changes to commit."
            exit 0
          fi
          git commit -m "Sync the live site from FTP."
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push attempt ${attempt} failed, retrying..."
            sleep $((attempt * 15))
          done
          exit 1
